<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <title>Checklist</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="sidebar-toggle" type="button" aria-label="Toggle sidebar">☰</button>
      <h1 id="current-list-name">Checklist</h1>
    </header>
    <div class="layout">
      <aside id="sidebar" aria-label="Checklists">
        <nav id="categories" aria-label="Checklists by category"></nav>
      </aside>
      <div id="backdrop"></div>
      <main class="app">
        <ul id="item-list" aria-label="Checklist items"></ul>
        <p id="empty-state" class="hint" hidden>Nothing here yet. Add your first item below.</p>
        <form id="new-item-form" autocomplete="off">
          <button type="button" id="outdent-button" title="Outdent (Shift+Tab)" aria-label="Add at parent level">‹</button>
          <button type="button" id="indent-button" title="Indent (Tab)" aria-label="Add at child level">›</button>
          <input
            id="new-item-input"
            type="text"
            placeholder="Add an item…"
            aria-label="New checklist item"
            required
          />
          <button type="submit" aria-label="Add item">+</button>
        </form>
        <p id="no-list-state" class="hint" hidden>Create a checklist in the sidebar to get started.</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
